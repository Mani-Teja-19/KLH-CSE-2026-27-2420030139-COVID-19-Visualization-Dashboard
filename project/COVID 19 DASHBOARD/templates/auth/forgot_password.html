<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password - COVID-19 Surveillance Portal</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/glassmorphism.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/dark-mode.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/animations.css') }}">
  
  <style>
    .login-wrapper {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 10% 20%, rgba(13, 110, 253, 0.15) 0%, transparent 40%),
                  radial-gradient(circle at 90% 80%, rgba(13, 148, 136, 0.15) 0%, transparent 40%),
                  var(--bg-main);
      padding: 24px;
    }
    .login-card {
      width: 100%;
      max-width: 440px;
      border-radius: 20px;
      padding: 36px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
    }
  </style>
</head>
<body>

  <div class="login-wrapper">
    <div class="login-card glass-card animate-fade-in">
      <div class="text-center mb-4">
        <div class="brand-icon mx-auto mb-3" style="width: 54px; height: 54px; font-size: 24px;">
          <i class="fa-solid fa-key"></i>
        </div>
        <h3 class="fw-bold mb-1">Reset Password</h3>
        <p class="text-secondary small">Recover your administrative account access</p>
      </div>

      <!-- Flash Messages -->
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          {% for category, message in messages %}
            <div class="alert alert-{{ category }} alert-dismissible fade show d-flex align-items-center gap-2 small py-2 px-3 mb-3 rounded-3" role="alert">
              <i class="fa-solid fa-circle-info"></i>
              <div>{{ message }}</div>
              <button type="button" class="btn-close ms-auto small" data-bs-dismiss="alert"></button>
            </div>
          {% endfor %}
        {% endif %}
      {% endwith %}

      <form action="{{ url_for('auth.forgot_password') }}" method="POST">
        <div class="mb-3">
          <label for="email" class="form-label">Registered Email Address</label>
          <div class="input-group">
            <span class="input-group-text bg-body-tertiary border-end-0"><i class="fa-solid fa-envelope text-muted"></i></span>
            <input type="email" class="form-control border-start-0 ps-0" id="email" name="email" placeholder="admin@covid19dashboard.gov" value="{{ email or '' }}" required>
          </div>
        </div>

        {% if email_verified %}
        <div class="mb-3">
          <label for="new_password" class="form-label">New Password</label>
          <div class="input-group">
            <span class="input-group-text bg-body-tertiary border-end-0"><i class="fa-solid fa-lock text-muted"></i></span>
            <input type="password" class="form-control border-start-0 border-end-0 ps-0" id="new_password" name="new_password" placeholder="Enter new password" required>
            <button class="btn btn-outline-secondary border-start-0 toggle-password-btn" type="button" data-target="new_password">
              <i class="fa-regular fa-eye"></i>
            </button>
          </div>
        </div>

        <div class="mb-4">
          <label for="confirm_password" class="form-label">Confirm New Password</label>
          <div class="input-group">
            <span class="input-group-text bg-body-tertiary border-end-0"><i class="fa-solid fa-lock text-muted"></i></span>
            <input type="password" class="form-control border-start-0 border-end-0 ps-0" id="confirm_password" name="confirm_password" placeholder="Confirm new password" required>
            <button class="btn btn-outline-secondary border-start-0 toggle-password-btn" type="button" data-target="confirm_password">
              <i class="fa-regular fa-eye"></i>
            </button>
          </div>
        </div>
        {% endif %}

        <button type="submit" class="btn btn-primary-custom w-100 py-2 justify-content-center fw-bold shadow">
          <i class="fa-solid fa-paper-plane me-2"></i> {% if email_verified %}Set New Password{% else %}Verify & Proceed{% endif %}
        </button>

        <div class="text-center mt-3">
          <a href="{{ url_for('auth.login') }}" class="small text-secondary text-decoration-none">
            <i class="fa-solid fa-arrow-left me-1"></i> Back to Login
          </a>
        </div>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="{{ url_for('static', filename='js/theme.js') }}"></script>
  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
