{% extends 'base.html' %}

{% block title %}Page Not Found{% endblock %}

{% block content %}
<div class="row justify-content-center my-5 py-5 text-center">
  <div class="col-lg-6">
    <div class="custom-card p-5 shadow-lg">
      <div class="brand-icon mx-auto mb-3 stat-warning" style="width: 72px; height: 72px; font-size: 32px;">
        <i class="fa-solid fa-triangle-exclamation"></i>
      </div>
      <h1 class="display-4 fw-bold text-primary mb-2">404</h1>
      <h4 class="fw-bold mb-3">Resource or Page Not Found</h4>
      <p class="text-secondary mb-4">The clinical record, epidemiological page, or jurisdiction requested does not exist or has been moved.</p>
      <a href="{{ url_for('dashboard.index') }}" class="btn btn-primary-custom shadow">
        <i class="fa-solid fa-house me-2"></i> Return to Surveillance Dashboard
      </a>
    </div>
  </div>
</div>
{% endblock %}
